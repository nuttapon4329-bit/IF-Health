<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IF & Health Mobile App (Smart AI Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lightBg: 'var(--bg-main)',
                        cardBg: 'var(--bg-card)',
                        accentColor: 'var(--accent)',
                        accentLight: 'var(--accent-light)',
                        textMain: 'var(--text-main)',
                        textSub: 'var(--text-sub)'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #e2e8f0;
            --accent: #6366f1;
            --accent-light: #e0e7ff;
            --text-main: #0f172a;
            --text-sub: #475569;
        }
        [data-theme="sunset"] { --bg-main: #fff1f2; --bg-card: #ffffff; --bg-input: #ffe4e6; --border-color: #fecdd3; --accent: #f43f5e; --accent-light: #ffe4e6; --text-main: #4c0519; --text-sub: #881337; }
        [data-theme="emerald"] { --bg-main: #f0fdf4; --bg-card: #ffffff; --bg-input: #dcfce7; --border-color: #bbf7d0; --accent: #059669; --accent-light: #dcfce7; --text-main: #022c22; --text-sub: #065f46; }
        [data-theme="cyberpunk"] { --bg-main: #fdf4ff; --bg-card: #ffffff; --bg-input: #fae8ff; --border-color: #f5d0fe; --accent: #d946ef; --accent-light: #fae8ff; --text-main: #4a044e; --text-sub: #86198f; }
        [data-theme="amber"] { --bg-main: #fffbeb; --bg-card: #ffffff; --bg-input: #fef3c7; --border-color: #fde68a; --accent: #d97706; --accent-light: #fef3c7; --text-main: #451a03; --text-sub: #92400e; }

        html.dark {
            --bg-main: #090d16; --bg-card: #111827; --bg-input: #1f2937; --border-color: #1f2937;
            --accent-light: rgba(99, 102, 241, 0.15); --text-main: #f8fafc; --text-sub: #94a3b8;
        }

        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-main); color: var(--text-main); -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease, color 0.3s ease; }
        .card-element { background-color: var(--bg-card); border-color: var(--border-color); box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04); transition: all 0.3s ease; }
        .input-element { background-color: var(--bg-input); border-color: var(--border-color); color: var(--text-main); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 5rem); }
        .art-shadow { box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.12); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20 select-none">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex flex-col items-center justify-center text-indigo-500 hidden">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2" style="color: var(--accent);"></i>
        <span class="text-xs font-medium text-slate-300">กำลังประมวลผลข้อมูล...</span>
    </div>

    <!-- Header -->
    <header class="px-5 py-3.5 card-element border-b sticky top-0 backdrop-blur-md z-40 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-2xl flex items-center justify-center shadow-sm" style="background-color: var(--accent-light);">
                <i class="fa-solid fa-fire text-base" style="color: var(--accent);"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight leading-none" style="color: var(--text-main);">Cal & Health AI</h1>
                <span class="text-[10px] font-semibold uppercase tracking-wider" style="color: var(--accent);">Smart Edition</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="toggleDarkMode()" class="p-2.5 input-element rounded-2xl active:scale-95 transition"><i id="dark-icon" class="fa-solid fa-moon text-xs text-amber-500"></i></button>
            <button onclick="openThemeModal()" class="p-2.5 input-element rounded-2xl active:scale-95 transition"><i class="fa-solid fa-palette text-xs" style="color: var(--accent);"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-4 py-4 max-w-md mx-auto w-full flex-grow space-y-5">

        <!-- TAB 1: CALORIE TRACKER -->
        <section id="tab-timer" class="space-y-4">
            <div class="card-element border rounded-3xl p-5 art-shadow space-y-3">
                <div class="flex items-center justify-between border-b border-slate-500/10 pb-3">
                    <div>
                        <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">วันที่บันทึก</span>
                        <input type="date" id="cal-log-date" onchange="loadDailyFoodLogs()" class="bg-transparent text-xs font-bold focus:outline-none block mt-0.5" style="color: var(--accent);">
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">เป้าหมาย</span>
                        <div id="target-cal-display" class="text-xs font-bold text-amber-500 mt-0.5">--</div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center pt-1">
                    <div class="input-element p-2.5 rounded-2xl border">
                        <span class="block text-[9px] text-slate-400 font-medium">ทานไปแล้ว</span>
                        <span id="total-consumed-cal" class="text-base font-extrabold" style="color: var(--accent);">0</span>
                    </div>
                    <div class="input-element p-2.5 rounded-2xl border">
                        <span class="block text-[9px] text-slate-400 font-medium">คงเหลือ</span>
                        <span id="remaining-cal" class="text-base font-extrabold text-sky-500">--</span>
                    </div>
                    <div class="input-element p-2.5 rounded-2xl border">
                        <span class="block text-[9px] text-slate-400 font-medium">สถานะ</span>
                        <span id="cal-status-text" class="text-[11px] font-bold text-slate-400">-</span>
                    </div>
                </div>
            </div>

            <!-- มื้อเช้า -->
            <div class="card-element border rounded-3xl p-4 art-shadow space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-sun text-amber-500"></i> มื้อเช้า (Breakfast)</h3>
                    <span id="sum-breakfast" class="text-xs font-bold text-slate-400">0 kcal</span>
                </div>
                <div id="container-breakfast" class="space-y-2"></div>
                <button onclick="addFoodRow('breakfast')" class="w-full py-2 border border-dashed rounded-xl text-xs font-medium text-slate-400 hover:border-indigo-500 active:scale-95 transition"><i class="fa-solid fa-plus mr-1"></i> เพิ่มเมนูมื้อเช้า</button>
            </div>

            <!-- มื้อเที่ยง -->
            <div class="card-element border rounded-3xl p-4 art-shadow space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-cloud-sun text-orange-500"></i> มื้อเที่ยง (Lunch)</h3>
                    <span id="sum-lunch" class="text-xs font-bold text-slate-400">0 kcal</span>
                </div>
                <div id="container-lunch" class="space-y-2"></div>
                <button onclick="addFoodRow('lunch')" class="w-full py-2 border border-dashed rounded-xl text-xs font-medium text-slate-400 hover:border-indigo-500 active:scale-95 transition"><i class="fa-solid fa-plus mr-1"></i> เพิ่มเมนูมื้อเที่ยง</button>
            </div>

            <!-- มื้อเย็น -->
            <div class="card-element border rounded-3xl p-4 art-shadow space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-moon text-indigo-500"></i> มื้อเย็น (Dinner)</h3>
                    <span id="sum-dinner" class="text-xs font-bold text-slate-400">0 kcal</span>
                </div>
                <div id="container-dinner" class="space-y-2"></div>
                <button onclick="addFoodRow('dinner')" class="w-full py-2 border border-dashed rounded-xl text-xs font-medium text-slate-400 hover:border-indigo-500 active:scale-95 transition"><i class="fa-solid fa-plus mr-1"></i> เพิ่มเมนูมื้อเย็น</button>
            </div>

            <!-- ของว่าง -->
            <div class="card-element border rounded-3xl p-4 art-shadow space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-cookie-bite text-pink-500"></i> ของว่าง (Snacks)</h3>
                    <span id="sum-snack" class="text-xs font-bold text-slate-400">0 kcal</span>
                </div>
                <div id="container-snack" class="space-y-2"></div>
                <button onclick="addFoodRow('snack')" class="w-full py-2 border border-dashed rounded-xl text-xs font-medium text-slate-400 hover:border-indigo-500 active:scale-95 transition"><i class="fa-solid fa-plus mr-1"></i> เพิ่มรายการของว่าง</button>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="clearDayLogs()" class="w-1/3 py-3 font-bold rounded-2xl text-xs border border-rose-500/30 text-rose-500 bg-rose-500/10 active:scale-95">เคลียร์วันนี้</button>
                <button onclick="saveFoodLogsToLocal()" class="w-2/3 py-3 font-bold rounded-2xl text-sm shadow-md text-white active:scale-95" style="background-color: var(--accent);">บันทึกข้อมูลอาหาร</button>
            </div>
        </section>

        <!-- TAB 2: HEALTH -->
        <section id="tab-health" class="hidden space-y-4">
            <div class="card-element border rounded-3xl p-5 art-shadow space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-bold"><i class="fa-solid fa-user-pen mr-1.5" style="color: var(--accent);"></i> ข้อมูลและเป้าหมาย</h2>
                    <button onclick="saveProfileToSheets()" class="px-3 py-1 font-semibold text-xs rounded-xl" style="background-color: var(--accent-light); color: var(--accent);">บันทึก</button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div><label class="text-slate-400 text-[10px]">เพศ</label><select id="user-gender" class="w-full input-element border rounded-xl p-2"><option value="male">ชาย</option><option value="female">หญิง</option></select></div>
                    <div><label class="text-slate-400 text-[10px]">อายุ</label><input type="number" id="user-age" value="28" class="w-full input-element border rounded-xl p-2"></div>
                    <div><label class="text-slate-400 text-[10px]">ส่วนสูง</label><input type="number" id="user-height" value="170" class="w-full input-element border rounded-xl p-2"></div>
                    <div><label class="text-slate-400 text-[10px]">น้ำหนัก</label><input type="number" id="user-weight" value="70" class="w-full input-element border rounded-xl p-2"></div>
                    <div><label class="text-slate-400 text-[10px]">เป้าหมาย</label><input type="number" id="user-target" value="62" class="w-full input-element border rounded-xl p-2"></div>
                    <div><label class="text-slate-400 text-[10px]">ลด/สัปดาห์</label><select id="user-loss-rate" class="w-full input-element border rounded-xl p-2"><option value="0.5" selected>0.5 กก.</option></select></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 inset-x-0 card-element border-t backdrop-blur-lg z-40 px-4 py-2 flex justify-around pb-safe art-shadow">
        <button onclick="switchTab('timer')" id="nav-timer" class="flex flex-col items-center space-y-1" style="color: var(--accent);"><i class="fa-solid fa-utensils text-lg"></i><span class="text-[10px] font-bold">Calorie Log</span></button>
        <button onclick="switchTab('health')" id="nav-health" class="flex flex-col items-center text-slate-400 space-y-1"><i class="fa-solid fa-chart-line text-lg"></i><span class="text-[10px]">Health</span></button>
    </nav>

    <!-- Theme Modal -->
    <div id="theme-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="card-element border rounded-3xl p-6 w-full max-w-sm space-y-3 art-shadow">
            <h3 class="font-bold text-sm">เลือกชุดสี</h3>
            <button onclick="applyTheme('default')" class="w-full p-3 input-element border rounded-2xl flex justify-between font-bold"><span>🔮 Modern Indigo</span></button>
            <button onclick="applyTheme('sunset')" class="w-full p-3 input-element border rounded-2xl flex justify-between font-bold"><span>🌅 Rose Sunset</span></button>
            <button onclick="applyTheme('emerald')" class="w-full p-3 input-element border rounded-2xl flex justify-between font-bold"><span>💎 Rich Emerald</span></button>
            <button onclick="closeThemeModal()" class="w-full py-2 bg-slate-500/10 rounded-xl text-xs font-bold">ปิด</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "ใส่_Web_App_URL_ของคุณที่นี่";
        let profileData = {}, foodLogsData = JSON.parse(localStorage.getItem('cal_art_food_logs')) || {};

        window.onload = function() {
            if (localStorage.getItem('if_dark_mode') === 'true') document.documentElement.classList.add('dark');
            applyTheme(localStorage.getItem('if_art_theme') || 'default', false);
            document.getElementById('cal-log-date').value = new Date().toISOString().split('T')[0];
            loadDailyFoodLogs();
            calculateTargetCal();
        };

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('if_dark_mode', isDark);
            document.getElementById('dark-icon').className = isDark ? 'fa-solid fa-sun text-xs text-amber-300' : 'fa-solid fa-moon text-xs text-amber-500';
        }

        function openThemeModal() { document.getElementById('theme-modal').classList.remove('hidden'); }
        function closeThemeModal() { document.getElementById('theme-modal').classList.add('hidden'); }
        function applyTheme(name) {
            if (name === 'default') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', name);
            localStorage.setItem('if_art_theme', name);
            closeThemeModal();
        }

        function loadDailyFoodLogs() {
            const dateKey = document.getElementById('cal-log-date').value;
            const dayData = foodLogsData[dateKey] || { breakfast: [], lunch: [], dinner: [], snack: [] };
            ['breakfast', 'lunch', 'dinner', 'snack'].forEach(meal => {
                const container = document.getElementById(`container-${meal}`);
                container.innerHTML = '';
                if (dayData[meal] && dayData[meal].length > 0) {
                    dayData[meal].forEach(item => appendFoodRowDOM(meal, item.name, item.cal));
                } else {
                    appendFoodRowDOM(meal, '', '');
                }
            });
            calculateTotalCalories();
        }

        function addFoodRow(meal) { appendFoodRowDOM(meal, '', ''); }

        function appendFoodRowDOM(meal, nameVal, calVal) {
            const container = document.getElementById(`container-${meal}`);
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 food-row';
            row.innerHTML = `
                <input type="text" placeholder="ชื่อเมนูอาหาร" value="${nameVal}" class="w-5/12 input-element border rounded-xl p-2 text-xs font-medium food-name">
                <button type="button" onclick="askAiForCal(this)" class="px-2 py-2 bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 rounded-xl text-[10px] font-bold active:scale-95" title="ให้ AI คำนวณแคล">🤖 AI</button>
                <input type="number" placeholder="kcal" value="${calVal}" oninput="calculateTotalCalories()" class="w-3/12 input-element border rounded-xl p-2 text-xs font-bold food-cal text-center">
                <button type="button" onclick="removeFoodRow(this)" class="w-2/12 p-2 text-rose-500 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs active:scale-95"><i class="fa-solid fa-trash-can"></i></button>
            `;
            container.appendChild(row);
            calculateTotalCalories();
        }

        // ฟังก์ชันสั่งให้ AI คำนวณแคลอรีจากชื่อเมนู
        async function askAiForCal(btn) {
            const row = btn.parentElement;
            const nameInput = row.querySelector('.food-name');
            const calInput = row.querySelector('.food-cal');
            const foodName = nameInput.value.trim();

            if (!foodName) {
                alert("กรุณากรอกชื่อเมนูก่อนกดให้ AI คำนวณครับ");
                return;
            }

            calInput.value = "...";
            showLoading(true);

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "estimateCal", foodName: foodName })
                });
                const result = await response.json();
                calInput.value = result.cal || 350;
                calculateTotalCalories();
            } catch (err) {
                console.error(err);
                calInput.value = 350; // ค่าสำรองเผื่อต่อเน็ตไม่ได้
                calculateTotalCalories();
            } finally {
                showLoading(false);
            }
        }

        function removeFoodRow(btn) {
            const row = btn.parentElement;
            const container = row.parentElement;
            if (container.children.length > 1) row.remove();
            else { row.querySelector('.food-name').value = ''; row.querySelector('.food-cal').value = ''; }
            calculateTotalCalories();
        }

        function calculateTotalCalories() {
            let grandTotal = 0;
            ['breakfast', 'lunch', 'dinner', 'snack'].forEach(meal => {
                let mealSum = 0;
                document.querySelectorAll(`#container-${meal} .food-row`).forEach(r => {
                    mealSum += Number(r.querySelector('.food-cal').value) || 0;
                });
                document.getElementById(`sum-${meal}`).innerText = `${mealSum} kcal`;
                grandTotal += mealSum;
            });
            document.getElementById('total-consumed-cal').innerText = grandTotal.toLocaleString();
            
            const targetCal = Number(document.getElementById('target-cal-display').innerText.replace(/[^0-9]/g, '')) || 2000;
            const remaining = targetCal - grandTotal;
            const remEl = document.getElementById('remaining-cal');
            const statusEl = document.getElementById('cal-status-text');

            remEl.innerText = remaining.toLocaleString();
            if (remaining >= 0) {
                remEl.className = 'text-base font-extrabold text-sky-500';
                statusEl.innerText = 'เหลือทานได้';
                statusEl.className = 'text-[11px] font-bold text-emerald-600';
            } else {
                remEl.className = 'text-base font-extrabold text-rose-500';
                statusEl.innerText = 'เกินเป้าหมาย!';
                statusEl.className = 'text-[11px] font-bold text-rose-500';
            }
        }

        function saveFoodLogsToLocal() {
            const dateKey = document.getElementById('cal-log-date').value;
            const dayData = { breakfast: [], lunch: [], dinner: [], snack: [] };
            ['breakfast', 'lunch', 'dinner', 'snack'].forEach(meal => {
                document.querySelectorAll(`#container-${meal} .food-row`).forEach(r => {
                    const name = r.querySelector('.food-name').value.trim();
                    const cal = Number(r.querySelector('.food-cal').value) || 0;
                    if (name || cal > 0) dayData[meal].push({ name, cal });
                });
            });
            foodLogsData[dateKey] = dayData;
            localStorage.setItem('cal_art_food_logs', JSON.stringify(foodLogsData));
            alert("บันทึกข้อมูลอาหารเรียบร้อยแล้ว!");
        }

        function calculateTargetCal() {
            const weight = Number(document.getElementById('user-weight').value) || 70;
            const height = Number(document.getElementById('user-height').value) || 170;
            const age = Number(document.getElementById('user-age').value) || 28;
            const bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            const tdee = bmr * 1.375;
            const target = Math.round(tdee - 500);
            document.getElementById('target-cal-display').innerText = target.toLocaleString() + ' kcal';
        }

        function switchTab(t) {
            ['timer', 'health'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.toggle('hidden', tab !== t);
                document.getElementById(`nav-${tab}`).style.color = tab === t ? 'var(--accent)' : '#94a3b8';
            });
        }

        function showLoading(show) { document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }
    </script>
</body>
</html>
