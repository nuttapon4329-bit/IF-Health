<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IF & Health Mobile App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#151c2c',
                        accentGreen: '#10b981',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.3s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Mobile Safe Area Padding */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 5rem); }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between pb-20 select-none">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-emerald-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2"></i>
        <span class="text-xs text-slate-300">กำลังเชื่อมต่อ Google Sheets...</span>
    </div>

    <!-- Header -->
    <header class="px-5 py-4 bg-slate-900/60 border-b border-slate-800/80 sticky top-0 backdrop-blur-md z-40 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
                <i class="fa-solid fa-heart-pulse text-base"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight leading-none text-white">IF Health Pro</h1>
                <span class="text-[10px] text-emerald-400 font-medium">Cloud Database Connected</span>
            </div>
        </div>
        <button onclick="fetchDataFromSheets()" class="p-2 bg-slate-800 border border-slate-700 rounded-xl text-slate-300 active:scale-95 transition">
            <i class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="px-4 py-4 max-w-md mx-auto w-full flex-grow space-y-5">

        <!-- TAB 1: TIMER -->
        <section id="tab-timer" class="space-y-4">
            <!-- Selector -->
            <div class="grid grid-cols-4 gap-1.5 bg-cardBg p-1.5 rounded-2xl border border-slate-800">
                <button onclick="setProtocol(16)" id="p-16" class="py-2 text-xs font-semibold rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">16/8</button>
                <button onclick="setProtocol(14)" id="p-14" class="py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white">14/10</button>
                <button onclick="setProtocol(12)" id="p-12" class="py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white">12/12</button>
                <button onclick="setProtocol(20)" id="p-20" class="py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white">20/4</button>
            </div>

            <!-- Dashboard Card -->
            <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 text-center flex flex-col items-center relative overflow-hidden shadow-xl">
                <!-- Custom Time Start Input -->
                <div class="w-full bg-slate-900/90 border border-slate-800 p-2.5 rounded-2xl mb-4 flex items-center justify-between text-left">
                    <div>
                        <div class="text-[10px] text-slate-400 uppercase font-semibold">เวลาเริ่มต้น IF</div>
                        <input type="datetime-local" id="custom-start-time" class="bg-transparent text-xs text-emerald-400 font-semibold focus:outline-none">
                    </div>
                    <button onclick="setCurrentTimeInput()" class="px-2.5 py-1.5 bg-slate-800 border border-slate-700 text-[10px] rounded-lg text-slate-300">ปัจจุบัน</button>
                </div>

                <!-- Circular Clock -->
                <div class="relative w-56 h-56 flex items-center justify-center my-1">
                    <svg class="w-full h-full" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#1e293b" stroke-width="7"></circle>
                        <circle id="progress-circle" cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="7" stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke-linecap="round" class="progress-ring__circle"></circle>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="timer-display" class="text-3xl font-extrabold text-white tracking-tight">00:00:00</span>
                        <span id="timer-label" class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">เวลาที่ผ่านไป</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 w-full mt-4 text-xs">
                    <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                        <span class="block text-[9px] text-slate-400">เริ่มเวลา</span>
                        <span id="start-disp" class="font-bold text-slate-200">--:--</span>
                    </div>
                    <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                        <span class="block text-[9px] text-slate-400">เป้าหมายจบ</span>
                        <span id="target-disp" class="font-bold text-slate-200">--:--</span>
                    </div>
                </div>

                <!-- Big Action Button -->
                <button id="btn-toggle-fast" onclick="toggleFast()" class="w-full mt-5 py-3.5 bg-emerald-500 text-slate-950 font-bold rounded-2xl text-sm shadow-lg shadow-emerald-500/20 active:scale-95 transition">
                    เริ่มอดอาหาร (Start Fasting)
                </button>
            </div>
        </section>

        <!-- TAB 2: HEALTH & WEIGHT -->
        <section id="tab-health" class="hidden space-y-4">
            <!-- Profile Form -->
            <div class="bg-cardBg border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-bold text-white"><i class="fa-solid fa-user-pen text-emerald-400 mr-1.5"></i> ข้อมูลร่างกาย</h2>
                    <button onclick="saveProfileToSheets()" class="px-3 py-1 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-semibold text-xs rounded-xl active:scale-95">บันทึกลง Cloud</button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="text-slate-400 text-[10px]">เพศ</label>
                        <select id="user-gender" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                            <option value="male">ชาย</option>
                            <option value="female">หญิง</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 text-[10px]">อายุ (ปี)</label>
                        <input type="number" id="user-age" value="28" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                    </div>
                    <div>
                        <label class="text-slate-400 text-[10px]">ส่วนสูง (ซม.)</label>
                        <input type="number" id="user-height" value="170" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                    </div>
                    <div>
                        <label class="text-slate-400 text-[10px]">น้ำหนักปัจจุบัน (กก.)</label>
                        <input type="number" step="0.1" id="user-weight" value="70" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                    </div>
                    <div class="col-span-2">
                        <label class="text-slate-400 text-[10px]">น้ำหนักเป้าหมาย (กก.)</label>
                        <input type="number" step="0.1" id="user-target" value="62" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                    </div>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-2 gap-2 text-center">
                <div class="bg-cardBg border border-slate-800 p-3 rounded-2xl">
                    <span class="text-[10px] text-slate-400">BMI</span>
                    <h3 id="bmi-val" class="text-xl font-bold text-emerald-400 mt-0.5">--</h3>
                </div>
                <div class="bg-cardBg border border-slate-800 p-3 rounded-2xl">
                    <span class="text-[10px] text-slate-400">แคลอรีแนะนำ/วัน</span>
                    <h3 id="cal-target-val" class="text-xl font-bold text-amber-400 mt-0.5">--</h3>
                </div>
            </div>

            <!-- Weight Chart -->
            <div class="bg-cardBg border border-slate-800 rounded-3xl p-4 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold text-white">กราฟการลดน้ำหนัก</h3>
                    <button onclick="openWeightModal()" class="px-3 py-1 bg-emerald-500 text-slate-950 text-xs font-bold rounded-xl active:scale-95">+ ชั่งน้ำหนัก</button>
                </div>
                <div class="w-full h-48">
                    <canvas id="weightChart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar (Mobile Friendly) -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-900/90 border-t border-slate-800 backdrop-blur-lg z-40 px-6 py-2 flex justify-around pb-safe">
        <button onclick="switchTab('timer')" id="nav-timer" class="flex flex-col items-center text-emerald-400 space-y-1">
            <i class="fa-solid fa-stopwatch text-lg"></i>
            <span class="text-[10px] font-medium">Timer</span>
        </button>
        <button onclick="switchTab('health')" id="nav-health" class="flex flex-col items-center text-slate-400 space-y-1">
            <i class="fa-solid fa-chart-line text-lg"></i>
            <span class="text-[10px] font-medium">Weight & Health</span>
        </button>
    </nav>

    <!-- Modal Log Weight -->
    <div id="weight-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-slate-800 rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm space-y-4">
            <h3 class="font-bold text-sm text-white">บันทึกน้ำหนักวันนี้</h3>
            <div>
                <label class="text-[10px] text-slate-400">วันที่</label>
                <input type="date" id="log-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
            </div>
            <div>
                <label class="text-[10px] text-slate-400">น้ำหนัก (กก.)</label>
                <input type="number" step="0.1" id="log-weight-val" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
            </div>
            <div class="flex gap-2">
                <button onclick="closeWeightModal()" class="w-1/3 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs">ยกเลิก</button>
                <button onclick="saveWeightToSheets()" class="w-2/3 py-2.5 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">บันทึกไป Cloud</button>
            </div>
        </div>
    </div>

    <script>
        // 🛑 กรุณาวาง URL Google Apps Script ของคุณที่นี่
        const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

        let fastingHours = 16, isRunning = false, startTime = null, targetEndTime = null, timerInterval = null;
        let weightChartInstance = null;
        let profileData = {}, weightLogs = [];

        window.onload = function() {
            setCurrentTimeInput();
            fetchDataFromSheets();
        };

        // --- GOOGLE SHEETS API CALLS ---
        async function fetchDataFromSheets() {
            showLoading(true);
            try {
                const resProfile = await fetch(`${GOOGLE_SCRIPT_URL}?action=getProfile`);
                profileData = await resProfile.json();

                const resLogs = await fetch(`${GOOGLE_SCRIPT_URL}?action=getLogs`);
                weightLogs = await resLogs.json();

                updateUIProfile();
                initOrUpdateChart();
            } catch (err) {
                alert("ไม่สามารถโหลดข้อมูลจาก Google Sheetsได้ กรุณาเช็ค URL ในระบบ");
            } finally {
                showLoading(false);
            }
        }

        async function saveProfileToSheets() {
            showLoading(true);
            const payload = {
                action: "saveProfile",
                gender: document.getElementById('user-gender').value,
                age: Number(document.getElementById('user-age').value),
                height: Number(document.getElementById('user-height').value),
                weight: Number(document.getElementById('user-weight').value),
                targetWeight: Number(document.getElementById('user-target').value)
            };
            await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
            profileData = payload;
            updateUIProfile();
            showLoading(false);
            alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
        }

        async function saveWeightToSheets() {
            showLoading(true);
            const date = document.getElementById('log-date').value;
            const weight = Number(document.getElementById('log-weight-val').value);

            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "saveWeight", date, weight })
            });

            closeWeightModal();
            await fetchDataFromSheets();
        }

        // --- UI & HEALTH COMPUTATION ---
        function updateUIProfile() {
            document.getElementById('user-gender').value = profileData.gender || 'male';
            document.getElementById('user-age').value = profileData.age || 28;
            document.getElementById('user-height').value = profileData.height || 170;
            document.getElementById('user-weight').value = profileData.weight || 70;
            document.getElementById('user-target').value = profileData.targetWeight || 62;

            // Calculations
            const hM = (profileData.height || 170) / 100;
            const bmi = ((profileData.weight || 70) / (hM * hM)).toFixed(1);
            document.getElementById('bmi-val').innerText = bmi;

            let bmr = (10 * profileData.weight) + (6.25 * profileData.height) - (5 * profileData.age);
            bmr = profileData.gender === 'male' ? bmr + 5 : bmr - 161;
            const tdee = bmr * 1.375;
            document.getElementById('cal-target-val').innerText = Math.round(tdee - 500).toLocaleString();
        }

        function initOrUpdateChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            weightLogs.sort((a,b) => new Date(a.date) - new Date(b.date));

            const labels = weightLogs.map(l => l.date);
            const data = weightLogs.map(l => l.weight);
            const targetData = weightLogs.map(() => profileData.targetWeight || 62);

            if (weightChartInstance) weightChartInstance.destroy();

            weightChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Weight', data, borderColor: '#10b981', borderWidth: 2, pointRadius: 3, tension: 0.2 },
                        { label: 'Target', data: targetData, borderColor: '#f59e0b', borderDash: [4,4], borderWidth: 1.5, pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { display: false } },
                        y: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#1e293b' } }
                    }
                }
            });
        }

        // --- TIMER FUNCTIONS ---
        function setCurrentTimeInput() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('custom-start-time').value = now.toISOString().slice(0, 16);
        }

        function toggleFast() {
            const btn = document.getElementById('btn-toggle-fast');
            if (!isRunning) {
                const val = document.getElementById('custom-start-time').value;
                if (!val) return alert("โปรดเลือกเวลาเริ่มต้น");
                startTime = new Date(val);
                targetEndTime = new Date(startTime.getTime() + fastingHours * 3600000);
                isRunning = true;
                btn.innerText = "สิ้นสุด Fasting";
                btn.className = btn.className.replace('bg-emerald-500', 'bg-red-500');
                startTimerLoop();
            } else {
                isRunning = false;
                clearInterval(timerInterval);
                btn.innerText = "เริ่มอดอาหาร (Start Fasting)";
                btn.className = btn.className.replace('bg-red-500', 'bg-emerald-500');
                document.getElementById('timer-display').innerText = "00:00:00";
                document.getElementById('progress-circle').style.strokeDashoffset = 263.89;
            }
        }

        function startTimerLoop() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = new Date();
                const elapsed = Math.floor((now - startTime) / 1000);
                const total = fastingHours * 3600;

                document.getElementById('start-disp').innerText = startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('target-disp').innerText = targetEndTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                if (elapsed < total) {
                    const rem = total - elapsed;
                    document.getElementById('timer-display').innerText = formatTime(rem);
                    document.getElementById('progress-circle').style.strokeDashoffset = 263.89 - ((elapsed / total) * 263.89);
                } else {
                    document.getElementById('timer-display').innerText = formatTime(elapsed - total);
                    document.getElementById('progress-circle').style.strokeDashoffset = 0;
                }
            }, 1000);
        }

        function formatTime(s) {
            const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }

        function setProtocol(h) {
            fastingHours = h;
            document.querySelectorAll('#tab-timer button[id^="p-"]').forEach(b => {
                b.className = "py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white";
            });
            document.getElementById(`p-${h}`).className = "py-2 text-xs font-semibold rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        }

        function switchTab(t) {
            document.getElementById('tab-timer').classList.add('hidden');
            document.getElementById('tab-health').classList.add('hidden');
            document.getElementById(`tab-${t}`).classList.remove('hidden');

            document.getElementById('nav-timer').className = t === 'timer' ? 'flex flex-col items-center text-emerald-400 space-y-1' : 'flex flex-col items-center text-slate-400 space-y-1';
            document.getElementById('nav-health').className = t === 'health' ? 'flex flex-col items-center text-emerald-400 space-y-1' : 'flex flex-col items-center text-slate-400 space-y-1';
        }

        function openWeightModal() {
            document.getElementById('log-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('log-weight-val').value = profileData.weight || 70;
            document.getElementById('weight-modal').classList.remove('hidden');
        }
        function closeWeightModal() { document.getElementById('weight-modal').classList.add('hidden'); }
        function showLoading(show) { document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }
    </script>
</body>
</html>
