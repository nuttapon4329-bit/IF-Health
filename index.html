<script>
  // เปลี่ยน URL นี้ให้เป็น Web App URL ล่าสุดของคุณจากการ Deploy Google Apps Script
  const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

  // ฟังก์ชันสำหรับโหลดข้อมูลทั้งหมดเมื่อเปิดเว็บ
  async function loadCalendarData() {
    try {
      let response = await fetch(WEB_APP_URL);
      let data = await response.json();
      
      // ดึงข้อมูลประวัติจาก key 'history' ที่ส่งมาจาก Google Apps Script
      let historyList = data.history || [];
      
      // เคลียร์สถานะเก่าบนหน้าเว็บก่อนเรนเดอร์ใหม่
      resetCalendarUI();
      
      // วนลูปนำข้อมูลแต่ละวันมาแสดงบนปฏิทิน
      historyList.forEach(item => {
        // item.date จะมาในรูปแบบ "YYYY-MM-DD" เช่น "2026-09-18"
        // item.status จะเป็น "success" หรืออื่นๆ
        updateCalendarDayStatus(item.date, item.status);
      });

      // อัปเดตสถิติ (Streak / สำเร็จเดือนนี้)
      calculateStats(historyList);

    } catch (error) {
      console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล:", error);
    }
  }

  // ฟังก์ชันตัวอย่างสำหรับจัดการหน้าตาปฏิทิน (ปรับเปลี่ยนชื่อฟังก์ชันให้ตรงกับโค้ดเดิมของคุณได้เลย)
  function updateCalendarDayStatus(dateStr, status) {
    // ค้นหา Element ของวันที่นั้นๆ ในปฏิทิน (เช่น อ้างอิงจาก data-date="2026-09-18")
    let dayElement = document.querySelector(`[data-date="${dateStr}"]`);
    if (dayElement) {
      // ลบสถานะเก่าออกก่อน
      dayElement.classList.remove('success', 'failed');
      
      // เติม class ตามสถานะที่บันทึกไว้ในชีท
      if (status === 'success') {
        dayElement.classList.add('success'); // จะแสดงจุดสีเขียวตาม UI ของคุณ
      } else if (status === 'failed') {
        dayElement.classList.add('failed'); // จุดสีแดง
      }
    }
  }

  function resetCalendarUI() {
    // ล้างค่าสถานะจุดสีบนปฏิทินทั้งหมดก่อนวาดใหม่
    document.querySelectorAll('.calendar-day').forEach(el => {
      el.classList.remove('success', 'failed');
    });
  }

  function calculateStats(historyList) {
    // ตัวอย่างการคำนวณจำนวนวันที่สำเร็จในเดือนนี้
    let successCount = historyList.filter(item => item.status === 'success').length;
    let successCountEl = document.getElementById('monthly-success-count');
    if (successCountEl) {
      successCountEl.innerText = successCount + " วัน";
    }
  }

  // เรียกใช้งานเมื่อโหลดหน้าเว็บ
  window.addEventListener('DOMContentLoaded', () => {
    loadCalendarData();
  });
</script>
